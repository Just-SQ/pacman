[project]
name = "pacman-13"
version = "0.1.0"
description = "Ghosts! More ghosts!"
readme = "README.md"
authors = [
    { email = "asaqi@student.1337.ma" },
    { email = "rkadri@student.1337.ma" }
]
requires-python = ">=3.14"
dependencies = [
    "mazegenerator",
    "pyglet>=2.1.16",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 79

[tool.mypy]
exclude = ".venv"

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-00001/mazegenerator-2.1.0-py3-none-any.whl" }

